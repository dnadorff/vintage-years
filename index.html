<html lang="en">

<meta name="description" content="A family winemaking game of timing for 1 to 6 players, with robots and linked phones.">

<style>
:root{
  --bg:#F6F1E7; --surface:#FFFDF8; --ink:#2B1D22; --muted:#665559; --line:#E1D4C3; --soft:#EFE6D8;
  --accent:#7A1F3D; --accent-ink:#FFFFFF; --good:#3D7A3A; --bad:#B23A3A; --focus:#1F6FEB;
  --red:#8E1B3A; --rose:#EE9DB3; --white:#F2D86A;
  --hill:#D5E5B9; --river-land:#F1D6BF; --meadow:#C6E2D9; --water:#A8CDE6;
  --rH:#4F7F2F; --rR:#B4572E; --rM:#2A7570;
  --cask:#8A5A2B; --vine:#6A3D9A; --trellis:#3B3B3B;
  --font-display: Georgia, "Iowan Old Style", "Palatino Linotype", serif;
  --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#17110F; --surface:#221A18; --ink:#F3E9E4; --muted:#BCA9A6; --line:#3E302D; --soft:#2C2220;
    --accent:#E0789A; --accent-ink:#1A0B10; --good:#7BC47A; --bad:#F08080; --focus:#7AB4FF;
    --hill:#3B4A2B; --river-land:#4D3627; --meadow:#24433E; --water:#2E4F66;
    --rH:#9CCB78; --rR:#F0A079; --rM:#7CCFC6; --cask:#D8A46A; --vine:#C29BEA; --trellis:#D8D8D8;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
body{padding:0 max(14px,env(safe-area-inset-right,0px)) 32px max(14px,env(safe-area-inset-left,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:20}
.app{max-width:540px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
h1,h2,h3{font-family:var(--font-display);margin:0;line-height:1.15}
h1{font-size:2.3rem} h2{font-size:1.4rem} h3{font-size:1.08rem}
p{margin:0} .muted{color:var(--muted)} .small{font-size:.88rem} .center{text-align:center}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px} [tabindex="-1"]:focus{outline:none}
.sr{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 0 6px;border-bottom:1px solid var(--line);white-space:nowrap}
.brand{font-family:var(--font-display);font-weight:700;font-size:1.15rem;display:flex;align-items:center;gap:8px}
.brand svg{width:26px;height:26px}
.meta{font-size:.88rem;color:var(--muted)}
.btn{font:inherit;font-weight:700;font-size:1rem;border-radius:12px;padding:12px 14px;cursor:pointer;width:100%;color:var(--ink);background:var(--surface);border:1.5px solid var(--line)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn-small{width:auto;padding:7px 12px;font-size:.9rem;border-radius:999px}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1 1 120px;min-width:0}
.stack{display:flex;flex-direction:column;gap:10px}
.panel{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:14px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;background:var(--soft);padding:4px;border-radius:12px}
.seg button{font:inherit;font-weight:700;font-size:.92rem;padding:9px 6px;border:0;border-radius:9px;background:transparent;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.18)}
label{font-weight:700;font-size:.92rem}
input[type=text]{font:inherit;padding:9px 11px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
select{font:inherit;padding:9px 8px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
.seat{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center}
.xbtn{font:inherit;font-weight:700;width:38px;height:38px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.chip{flex:0 0 auto;font:inherit;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:6px 10px;display:flex;flex-direction:column;align-items:flex-start;cursor:pointer;color:var(--ink);min-width:80px}
.chip .n{font-weight:700;font-size:.86rem;max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip .s{font-size:.78rem;color:var(--muted)}
.chip.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.yearcard{display:flex;flex-direction:column;gap:6px}
.yearline{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tag{display:inline-flex;align-items:center;gap:5px;font-weight:700;font-size:.9rem;padding:4px 10px;border-radius:999px;border:1.5px solid currentColor}
.tag.H{color:var(--rH)}.tag.R{color:var(--rR)}.tag.M{color:var(--rM)}
.tag.C{color:var(--cask)}.tag.V{color:var(--vine)}.tag.T{color:var(--trellis)}
.prompt{background:var(--soft);border-radius:12px;padding:10px 12px;font-size:.95rem}
.prompt.bonus{background:var(--accent);color:var(--accent-ink)}
.mapwrap{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;overflow:hidden}
svg.map{display:block;width:100%;height:auto;touch-action:manipulation}
.map .tap{fill:transparent;cursor:pointer}
.map .glow{fill:none;stroke:var(--accent);stroke-width:2.4;stroke-dasharray:4 3;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{stroke-opacity:.35}}
@media (prefers-reduced-motion: reduce){.map .glow{animation:none}}
.workers{overflow-x:auto}
.grid{border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:.78rem;width:100%;table-layout:fixed;min-width:340px}
.grid th,.grid td{border:1px solid var(--line);text-align:center;padding:3px 0;height:24px}
.grid th{font-weight:700;color:var(--muted);font-size:.7rem}
.grid td.now{background:var(--soft);outline:2px solid var(--accent);outline-offset:-2px}
.grid td.extra,.grid th.extra{background:repeating-linear-gradient(45deg,transparent 0 4px,var(--soft) 4px 6px)}
.grid .wk{width:30px}
.wdot{display:inline-block;width:14px;height:14px;border-radius:50%;border:1.5px solid var(--ink);vertical-align:middle}
.wdot.red{background:var(--red)}.wdot.rose{background:var(--rose)}.wdot.white{background:var(--white)}
.res{display:flex;flex-direction:column;gap:10px}
.track{display:flex;gap:3px;flex-wrap:wrap;align-items:center}
.cask{width:22px;height:22px;border-radius:6px;border:1.5px dashed var(--line);display:grid;place-items:center;font-size:.7rem;font-weight:700}
.cask.have{background:var(--cask);border:1.5px solid var(--cask);color:#fff}
.cask.used{background:transparent;border:1.5px solid var(--cask);color:var(--cask);text-decoration:line-through}
.vine{width:22px;height:22px;border-radius:50% 50% 6px 6px;border:1.5px dashed var(--line);display:grid;place-items:center;font-size:.62rem;font-weight:700;position:relative}
.vine.have{background:var(--vine);border:1.5px solid var(--vine);color:#fff}
.vine.bonus{border-color:var(--accent);border-style:solid}
.trow{display:grid;grid-template-columns:repeat(5,22px) 1fr;gap:3px;align-items:center}
.tbox{width:22px;height:22px;border-radius:5px;border:1.5px dashed var(--line);display:grid;place-items:center;font-weight:800;font-size:.8rem}
.tbox.have{border:1.5px solid var(--trellis);color:var(--trellis)}
.trow .rule{font-size:.84rem;padding-left:6px}
.trow.done .rule{font-weight:700;color:var(--good)}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:.8rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:4px}
.score-line{font-size:.9rem}
table.scores{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:.9rem}
table.scores th,table.scores td{padding:7px 5px;border-bottom:1px solid var(--line);text-align:right}
table.scores th:first-child,table.scores td:first-child{text-align:left}
table.scores tr.win td{font-weight:800}
.banner{background:var(--accent);color:var(--accent-ink);border-radius:16px;padding:16px;text-align:center}
.banner .big{font-family:var(--font-display);font-size:1.7rem;font-weight:700}
.codebig{font-family:var(--font-display);font-weight:700;font-size:2rem;letter-spacing:.06em;text-align:center;background:var(--accent);color:var(--accent-ink);border-radius:16px;padding:12px 8px}
input.code{font-family:var(--font-display);font-weight:700;font-size:1.4rem;letter-spacing:.1em;text-align:center;text-transform:uppercase}
.msg{font-weight:700;font-size:.95rem}.msg.bad{color:var(--bad)}.msg.good{color:var(--good)}
dialog{border:0;border-radius:18px;padding:0;background:var(--surface);color:var(--ink);width:min(92vw,480px);max-height:86vh}
dialog::backdrop{background:rgba(15,8,10,.6)}
.dlg{padding:16px;display:flex;flex-direction:column;gap:10px;max-height:86vh;overflow:auto}
.dlg ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.handoff{text-align:center;padding:30px 0 10px;display:flex;flex-direction:column;gap:14px;align-items:center}
.handoff .big{font-family:var(--font-display);font-size:2rem;font-weight:700}
.log{font-size:.88rem;display:flex;flex-direction:column;gap:3px}
.hero{padding:18px 0 4px;display:flex;flex-direction:column;gap:8px}
.hero .tagline{color:var(--accent);font-weight:700;letter-spacing:.05em;text-transform:uppercase;font-size:.8rem}
.thinking{font-style:italic;color:var(--muted)}

.coach{background:var(--soft);border-left:5px solid var(--accent);border-radius:12px;padding:12px 14px}
.coach .btn-small{align-self:flex-start}
.hint{border:2px solid var(--focus);border-radius:12px;padding:10px 12px;background:var(--surface)}
.hint b{color:var(--focus)}
.btn.hinted{outline:3px solid var(--focus);outline-offset:2px}
</style>

<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M9 4h14c0 8-2 12-7 13-5-1-7-5-7-13z" fill="#8E1B3A"/><path d="M16 17v8m-5 3h10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span>Vintage Years</span></div>
    <div class="meta" id="meta"></div>
    <button class="btn btn-small" id="menuBtn" type="button">Menu</button>
  </header>
  <div class="sr" role="status" aria-live="polite" id="live"></div>
  <main id="view" class="stack"></main>
  <p class="small muted center" id="build">Build ce1c5dc1 · works offline</p>
  <dialog id="dlg"><div class="dlg" id="dlgBody"></div></dialog>
</div>
<script>
// Vintage Years: rules engine. Pure functions over plain objects, deterministic from a seed.
const VY = (() => {
  const REGIONS = ['H', 'R', 'M'];
  const REGION_NAME = { H: 'Hillside', R: 'Riverside', M: 'Meadows' };
  const RES = ['C', 'V', 'T'];
  const RES_NAME = { C: 'Casks', V: 'Vines', T: 'Trellises' };
  const COLORS = ['red', 'rose', 'white'];            // worker 0 makes red, 1 rosé, 2 white
  const COLOR_NAME = { red: 'red', rose: 'rosé', white: 'white' };
  const LAST_YEAR = 13, GRID = 16;                    // years '00 to '13, with room to run on to '15
  const CASK_SLOTS = 12, VINE_SLOTS = 12, TRELLIS_ROW = 5;
  const VERSION = 1;

  // The map: 27 glasses, 9 per region (three each of 1-, 2- and 3-year wines), 8 paths inside each region, 3 bridges.
  const NODES = [
    // Hillside
    { r: 'H', age: 1, x: 34, y: 44 }, { r: 'H', age: 2, x: 88, y: 30 }, { r: 'H', age: 3, x: 142, y: 50 },
    { r: 'H', age: 2, x: 50, y: 100 }, { r: 'H', age: 3, x: 106, y: 94 }, { r: 'H', age: 2, x: 160, y: 108 },
    { r: 'H', age: 1, x: 26, y: 154 }, { r: 'H', age: 3, x: 84, y: 150 }, { r: 'H', age: 1, x: 136, y: 160 },
    // Riverside
    { r: 'R', age: 2, x: 214, y: 34 }, { r: 'R', age: 3, x: 268, y: 42 }, { r: 'R', age: 1, x: 326, y: 34 },
    { r: 'R', age: 3, x: 232, y: 96 }, { r: 'R', age: 2, x: 290, y: 98 }, { r: 'R', age: 1, x: 338, y: 128 },
    { r: 'R', age: 1, x: 212, y: 156 }, { r: 'R', age: 3, x: 266, y: 154 }, { r: 'R', age: 2, x: 320, y: 176 },
    // Meadows
    { r: 'M', age: 1, x: 36, y: 216 }, { r: 'M', age: 3, x: 90, y: 212 }, { r: 'M', age: 2, x: 146, y: 226 },
    { r: 'M', age: 3, x: 198, y: 214 }, { r: 'M', age: 2, x: 254, y: 222 }, { r: 'M', age: 1, x: 318, y: 232 },
    { r: 'M', age: 2, x: 66, y: 268 }, { r: 'M', age: 3, x: 176, y: 272 }, { r: 'M', age: 1, x: 290, y: 276 },
  ];
  const EDGES = [
    [0, 1], [1, 4], [2, 4], [2, 5], [4, 3], [3, 6], [4, 7], [7, 8],             // Hillside
    [9, 10], [10, 11], [10, 13], [13, 14], [9, 12], [12, 16], [12, 15], [16, 17], // Riverside
    [18, 19], [19, 20], [20, 21], [21, 22], [22, 23], [19, 24], [21, 25], [22, 26], // Meadows
    [2, 9], [7, 19], [16, 22],                                                   // bridges
  ];
  const ADJ = NODES.map(() => []);
  EDGES.forEach(([a, b], i) => { ADJ[a].push([b, i]); ADJ[b].push([a, i]); });
  const INNER = REGIONS.map(R => EDGES.map((e, i) => i).filter(i => NODES[EDGES[i][0]].r === R && NODES[EDGES[i][1]].r === R));

  /* ---------- randomness ---------- */
  function mulberry32(a) {
    return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  }
  function hashSeed(...parts) { let h = 0x811c9dc5; for (const ch of parts.join('|')) { h ^= ch.charCodeAt(0); h = Math.imul(h, 0x01000193); } return h >>> 0; }
  function shuffle(a, rnd) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
  const pick = (a, rnd) => a[Math.floor(rnd() * a.length)];

  /* ---------- map generation (one "page") ---------- */
  function genMap(seed) {
    const rnd = mulberry32(hashSeed('map', seed));
    const color = Array(27), cask = Array(27).fill(0), edgeRes = Array(27).fill(null);
    // In each region, the three glasses of each age are one red, one rosé, one white.
    for (const R of REGIONS) for (const age of [1, 2, 3]) {
      const ids = NODES.map((n, i) => i).filter(i => NODES[i].r === R && NODES[i].age === age);
      shuffle(COLORS, rnd).forEach((c, k) => { color[ids[k]] = c; });
    }
    // Year '00: one region and one resource, then each cycles in a fixed order.
    const regCycle = shuffle(REGIONS, rnd), resCycle = shuffle(RES, rnd);
    const schedRegion = Array(14).fill(null), schedRes = Array(14).fill(null);
    for (let y = 0; y <= 12; y++) {
      if (y === 0) { schedRegion[0] = regCycle[0]; schedRes[0] = resCycle[0]; }
      else if (y % 2) schedRegion[y] = regCycle[((y + 1) / 2) % 3];
      else schedRes[y] = resCycle[(y / 2) % 3];
    }
    // Starting setup: the red worker passes, one worker makes a 3-year wine, the other gains 2 of the year's resource.
    const wineWorker = rnd() < 0.5 ? 1 : 2, resWorker = 3 - wineWorker;
    const startNode = NODES.findIndex((n, i) => n.r === schedRegion[0] && n.age === 3 && color[i] === COLORS[wineWorker]);
    // Casks: in each region, one glass per age needs casks, needing 1, 1 and 2 (never the starting wine).
    for (const R of REGIONS) {
      const need = shuffle([1, 1, 2], rnd);
      [1, 2, 3].forEach((age, k) => {
        const ids = NODES.map((n, i) => i).filter(i => NODES[i].r === R && NODES[i].age === age && i !== startNode);
        cask[pick(ids, rnd)] = need[k];
      });
    }
    // Path resources: each region gets one resource type on 4 of its 8 inner paths.
    const regRes = shuffle(RES, rnd);
    REGIONS.forEach((R, k) => shuffle(INNER[k], rnd).slice(0, 4).forEach(i => { edgeRes[i] = regRes[k]; }));
    // Vine bonuses: a 1-, 2- and 3-year wine in three different colors, then any wine at the last vine.
    const ages = shuffle([1, 2, 3], rnd), cols = shuffle(COLORS, rnd);
    const pos = [pick([3, 4], rnd), pick([6, 7], rnd), pick([9, 10], rnd)];
    const vineRewards = pos.map((p, k) => ({ pos: p, age: ages[k], color: cols[k] })).concat([{ pos: 12, any: true }]);
    // Trellis rows: a color, an age, and a region.
    const trellis = [{ color: pick(COLORS, rnd) }, { age: pick([1, 2, 3], rnd) }, { region: pick(REGIONS, rnd) }];
    const startTrellisRows = shuffle([0, 1, 2], rnd).slice(0, 2);
    return { seed, color, cask, edgeRes, schedRegion, schedRes, start: { wineWorker, resWorker, node: startNode, region: schedRegion[0], res: schedRes[0], trellisRows: startTrellisRows }, vineRewards, trellis };
  }

  /* ---------- sheets ---------- */
  function newSheet(map) {
    const sh = { occ: [0, 1, 2].map(() => Array(GRID).fill('')), circled: Array(27).fill(false), filled: Array(27).fill(false),
      caskT: 0, caskU: 0, vines: 0, trellis: [0, 0, 0], queue: [], turn: null, made: [] };
    const s = map.start;
    sh.occ[0][0] = '-';
    for (let y = 0; y < 3; y++) sh.occ[s.wineWorker][y] = s.region;
    for (let y = 0; y < 2; y++) sh.occ[s.resWorker][y] = s.res;
    sh.circled[s.node] = true; sh.made.push(s.node);
    if (s.res === 'C') sh.caskT = 2;
    else if (s.res === 'V') sh.vines = 2;
    else s.trellisRows.forEach(r => { sh.trellis[r] = 1; });
    return sh;
  }
  const available = (sh, y) => [0, 1, 2].filter(w => sh.occ[w][y] === '');
  const casksFree = sh => sh.caskT - sh.caskU;

  // Which glasses could this worker make right now in this region?
  function wineOptions(sh, map, region, w) {
    return NODES.map((n, i) => i).filter(i => NODES[i].r === region && !sh.circled[i] && map.color[i] === COLORS[w] && map.cask[i] <= casksFree(sh));
  }
  function startTurn(sh, y, region, res) { sh.turn = { y, region, res, wine: null, gain: null }; }

  function circle(sh, map, node) {
    sh.circled[node] = true; sh.made.push(node); sh.caskU += map.cask[node];
    for (const [other, e] of ADJ[node]) if (sh.circled[other] && !sh.filled[e]) {
      sh.filled[e] = true;
      if (map.edgeRes[e]) sh.queue.push({ t: 'gain', res: map.edgeRes[e], n: 1, from: 'path' });
    }
  }
  function makeWine(sh, map, w, node) {
    const t = sh.turn;
    if (!t || t.wine !== null || sh.occ[w][t.y] !== '' || t.gain && t.gain.w === w) return false;
    if (!wineOptions(sh, map, t.region, w).includes(node)) return false;
    const age = NODES[node].age;
    for (let k = 0; k < age; k++) sh.occ[w][t.y + k] = t.region;
    t.wine = { w, node }; circle(sh, map, node); return true;
  }
  function gainRes(sh, w, n) {
    const t = sh.turn;
    if (!t || t.gain !== null || sh.occ[w][t.y] !== '' || n < 1 || n > 3) return false;
    for (let k = 0; k < n; k++) sh.occ[w][t.y + k] = t.res;
    t.gain = { w, n }; sh.queue.push({ t: 'gain', res: t.res, n, from: 'action' }); return true;
  }

  // Resolve queued effects until a choice is needed. Returns null when done, or the choice that's waiting.
  function nextChoice(sh, map) {
    while (sh.queue.length) {
      const q = sh.queue[0];
      if (q.t === 'gain') {
        if (q.res === 'C') { sh.caskT = Math.min(CASK_SLOTS, sh.caskT + q.n); sh.queue.shift(); continue; }
        if (q.res === 'V') {
          sh.queue.shift();

        el('div', { class: 'row' }, [1, 2, 3].map(n => btn(`${n} ${n === 1 ? VY.RES_NAME[t.res].replace(/s$/, '') : VY.RES_NAME[t.res]}`, h && h.gain && h.gain.n === n && !(h.wine && !h.gainFirst) ? 'hinted' : '', () => {
          if (VY.gainRes(sh, gainW, n)) { save(); announce(`Gathered ${n} ${VY.RES_NAME[t.res]}.`); render(); }
        }, { 'aria-label': `Gather ${n} ${VY.RES_NAME[t.res]}, worker busy until ${yr(y + n)}` }))),
        el('p', { class: 'small muted' }, `Busy for that many years: free again in ${yr(y + 1)}, ${yr(y + 2)}, or ${yr(y + 3)}.`));
    }
    if (!tut() && !h) act.append(btn('Show a hint', '', () => { hintOn = hkey; render(); }));
    act.append(el('div', { class: 'row' }, btn('Start this year over', '', () => { VG.restartTurn(G, seat); save(); render(); }),
      btn('Done with this year', 'btn-primary', () => finishYear(seat), { disabled: choice ? true : null })));
    view.append(act, scoreLine(sh, m), workersGrid(sh, y), resources(sh, m));
    focusTop();
  }
  function confirmWine(seat, i) {
    const sh = G.sheets[seat], m = VG.mapFor(G, seat), n = VY.NODES[i], w = VY.COLORS.indexOf(m.color[i]), y = G.year;
    openDlg(el('h2', {}, `Make a ${wineName(m, i)}?`),
      el('p', {}, `Your ${WORKER[w].toLowerCase()} worker will be busy for ${plural(n.age, 'year')}, free again in ${yr(y + n.age)}.${m.cask[i] ? ` It uses ${plural(m.cask[i], 'cask')}.` : ''}`),
      el('div', { class: 'row' }, btn('Cancel', '', closeDlg), btn('Make wine', 'btn-primary', () => { closeDlg(); if (VY.makeWine(sh, m, w, i)) { save(); announce(`Made a ${wineName(m, i)}.`); } render(); })));
  }
  function confirmBonus(seat, i, rw) {
    const sh = G.sheets[seat], m = VG.mapFor(G, seat);
    openDlg(el('h2', {}, `Take a ${wineName(m, i)}?`), el('p', {}, `It's free from your vines, in ${VY.REGION_NAME[VY.NODES[i].r]}.${m.cask[i] ? ` It uses ${plural(m.cask[i], 'cask')}.` : ''}`),
      el('div', { class: 'row' }, btn('Choose another', '', closeDlg), btn('Take this wine', 'btn-primary', () => { closeDlg(); VY.chooseRewardWine(sh, m, i); save(); render(); })));
  }
  function trellisDlg(seat, choice) {
    const sh = G.sheets[seat], m = VG.mapFor(G, seat);
    if (tut()) { G.tut.seen.trellis = true; save(); }
    const h = (tut() || hintOn === `turn:${G.year}:${seat}`) ? VH.choiceHint(sh, m, choice, 13 - G.year) : null;
    openDlg(el('h2', {}, 'Place a trellis'), el('p', {}, choice.left > 1 ? `You have ${choice.left} trellises to place, one at a time.` : 'Choose a row for your trellis.'),
      tut() ? el('p', { class: 'small' }, COACH.trellis) : '', h ? hintBox(h) : '',
      el('div', { class: 'stack' }, choice.rows.map(r => btn(`${trellisRule(m.trellis[r])} (${sh.trellis[r]} of 5)${h && h.row === r ? ' (suggested)' : ''}`, h && h.row === r ? 'hinted' : '', () => { closeDlg(); VY.placeTrellis(sh, r); save(); render(); }))), { modal: true });
  }
  function finishYear(seat) {
    const sh = G.sheets[seat], m = VG.mapFor(G, seat), t = sh.turn;
    const av = VY.available(sh, G.year).filter(w => !(t.wine && t.wine.w === w));
    const couldWine = !t.wine && av.some(w => VY.wineOptions(sh, m, t.region, w).length), couldGain = !t.gain && av.length;
    const go = () => { closeDlg(); if (VG.finishTurn(G, seat)) { handedTo = null; gainW = null; save(); render(); } };
    if (couldWine || couldGain) openDlg(el('h2', {}, 'Finish the year?'), el('p', {}, `You could still ${[couldWine && 'make wine', couldGain && `gather ${VY.RES_NAME[t.res]}`].filter(Boolean).join(' or ')}. Any free worker will pass this year.`),
      el('div', { class: 'row' }, btn('Keep playing', '', closeDlg), btn('Finish the year', 'btn-primary', go)));
    else go();
  }

  /* ---------- end of the game ---------- */
  function endScreen(view) {
    const missing = G.cfg.mode === 'linked' ? G.cfg.seats.map((x, i) => i).filter(i => !G.sheets[i] && !G.others[i]) : [];
    if (missing.length) {
      const me = G.cfg.me, sc = VY.sheetScore(G.sheets[me], VG.mapFor(G, me));
      const form = el('div', { class: 'stack' });
      const vals = {};
      missing.forEach(i => {
        vals[i] = { base: '', longest: '', casks: '' };
        const f = (k, lab) => { const inp = el('input', { type: 'text', inputmode: 'numeric', pattern: '[0-9]*', 'aria-label': `${G.cfg.seats[i].name}: ${lab}`, placeholder: lab }); inp.addEventListener('input', () => { vals[i][k] = inp.value; }); return el('div', { class: 'stack', style: 'gap:2px' }, el('label', { class: 'small' }, lab), inp); };
        form.append(el('div', { class: 'panel stack' }, el('h3', {}, G.cfg.seats[i].name), el('div', { class: 'row' }, f('base', 'Points before bonuses'), f('longest', 'Longest tour'), f('casks', 'Casks used'))));
      });
      view.append(el('h2', {}, 'Compare with the other phones'),
        el('div', { class: 'panel stack' }, el('p', {}, 'Read these out to everyone:'), el('p', {}, el('b', {}, `${sc.base} points before bonuses · longest tour ${sc.longest} · ${sc.casks} casks used`))),
        el('p', {}, 'Then type in what each other player reads out. The bonuses for longest tour, most casks, and fewer leader years are worked out from these.'), form,
        btn('See final scores', 'btn-primary', () => {
          for (const i of missing) { const v = vals[i]; G.others[i] = { base: +v.base || 0, longest: +v.longest || 0, casks: +v.casks || 0 }; }
          save(); render();
        }));
      focusTop(); return;
    }
    const R = VG.results(G), win = R.filter(r => r.winner);
    if (tut()) view.append(el('div', { class: 'coach stack', role: 'note' }, el('b', {}, 'Coach: how your score adds up'),
      el('p', {}, 'You get 1 point for each filled path and 1 for each cask you used. A full trellis row scores its bonus. In a solo game, a longest tour of 7 or more paths and using 7 or more casks are worth 3 points each. With other players, those 3 points go to whoever has the longest tour and whoever used the most casks, and leading fewer years than someone else is worth 1.'),
      el('p', {}, 'That is the whole game. Start a real game from setup, alone or with the family, and use the Hint button any time you want a suggestion.')));
    view.append(el('div', { class: 'banner' }, G.solo ? [el('div', { class: 'big' }, `${R[0].total} points`), el('p', {}, R[0].rank)]
      : [el('div', { class: 'big' }, win.length > 1 ? `Tie: ${win.map(r => r.name).join(' and ')}` : `${win[0].name} wins!`), el('p', {}, `${win[0].total} points`)]));
    view.append(el('div', { class: 'panel stack' }, el('h3', {}, 'Final scores'), R.slice().sort((a, b) => b.total - a.total).map(r => el('div', { class: 'stack', style: 'gap:2px;border-bottom:1px solid var(--line);padding-bottom:8px' },
      el('p', {}, el('b', {}, `${r.name}: ${r.total}`)),
      el('p', { class: 'small muted' }, [r.paths !== undefined ? `paths ${r.paths} · casks used ${r.casks} · trellis ${(r.trellis || []).reduce((a, b) => a + b, 0)}` : `${r.base} before bonuses`,
        `longest tour ${r.longest}${r.longestBonus ? ' (+3)' : ''}`, r.caskBonus ? (G.solo ? '7+ casks (+3)' : 'most casks (+3)') : null, r.leaderBonus ? 'fewer leader years (+1)' : null].filter(Boolean).join(' · '))))),
    G.solo ? el('p', { class: 'small muted' }, 'Ranks: 20 Apprentice, 25 Artisan, 30 Winemaker, 35 Master Vintner.') : '');
    const mine = G.cfg.mode === 'linked' ? G.cfg.me : G.cfg.seats.findIndex(x => x.kind === 'human');
    view.append(el('div', { class: 'stack' },
      G.cfg.mode === 'pass' && !tut() ? btn('Play again with the same players', 'btn-primary', () => { G = VG.newGame({ seats: G.cfg.seats, sameMap: G.cfg.sameMap, mode: 'pass' }, newSeed()); handedTo = null; save(); render(); }) : null,
      btn('See my vineyard', '', () => viewSheet(mine)),
      btn(tut() ? 'Play a real game' : 'New game setup', tut() ? 'btn-primary' : '', () => { G = null; drop(KEY); render(); })));
    focusTop();
  }

  /* ---------- dialogs ---------- */
  function openDlg(...kids) {
    let modal = false; if (kids.length && kids[kids.length - 1] && kids[kids.length - 1].modal) { modal = true; kids.pop(); }
    const d = $('dlg'), b = $('dlgBody'); b.innerHTML = ''; kids.forEach(k => k && b.append(k)); d.dataset.modal = modal ? '1' : '';
    if (!d.open) d.showModal(); const f = b.querySelector('button'); if (f) f.focus();
  }
  function closeDlg() { const d = $('dlg'); if (d.open) d.close(); }
  $('dlg').addEventListener('cancel', e => { if ($('dlg').dataset.modal) e.preventDefault(); });
  const alertBox = t => openDlg(el('p', {}, t), btn('OK', 'btn-primary', closeDlg));
  function rules() {
    openDlg(el('h2', {}, 'How to play'), el('ul', {},
      el('li', {}, el('b', {}, 'Thirteen years. '), 'Each year has a region and a resource. One is printed for the year, and the leader picks the other. Leaders take turns in snake order. In the last year everyone picks both.'),
      el('li', {}, el('b', {}, 'Three workers. '), 'Red makes red wine, rosé makes rosé, white makes white. Each year you may use one free worker to make wine and one to gather the resource. A worker is free when its box for the year is empty.'),
      el('li', {}, el('b', {}, 'Making wine. '), 'Pick a glass in the year’s region that matches a free worker. Its number is how many years the worker stays busy. Barrels under a glass are casks it needs.'),
      el('li', {}, el('b', {}, 'Paths. '), 'When two of your wines are joined by a path, the path fills in and scores 1 point. A letter on the path gives you that resource.'),
      el('li', {}, el('b', {}, 'Gathering. '), 'Gather 1, 2, or 3 of the year’s resource. The worker is busy that many years.'),
      el('li', {}, el('b', {}, 'Casks '), 'pay for wines that need them, and each one used is a point. ', el('b', {}, 'Vines '), 'fill left to right, and a marked vine gives a free matching wine anywhere. ', el('b', {}, 'Trellises '), 'fill rows of 5, and a full row scores its bonus.'),
      el('li', {}, el('b', {}, 'Scoring. '), '1 per filled path, 3 for the longest tour of joined paths, 1 per cask used, 3 for the most casks used, your trellis bonuses, and 1 if you led fewer years than someone else. Solo: the tour and cask bonuses need 7 or more.')),
      el('p', { class: 'small muted' }, 'Vintage Years is a family-made game inspired by the roll-and-write Bordeaux by Ben Rosset. If you enjoy it, the real book is worth owning.'),
      btn('Close', '', closeDlg));
  }
  $('menuBtn').addEventListener('click', () => {
    openDlg(el('h2', {}, 'Menu'), btn('How to play', '', () => { closeDlg(); rules(); }),
      G ? btn('Players and maps', '', () => { closeDlg(); openDlg(el('h2', {}, 'Players'), chips(-1), el('p', { class: 'small muted' }, 'Tap a player to see their vineyard.'), btn('Close', '', closeDlg)); }) : null,
      G ? btn('Quit this game', '', () => { closeDlg(); openDlg(el('p', {}, 'Quit this game? It cannot be resumed.'), el('div', { class: 'row' }, btn('Keep playing', '', closeDlg), btn('Quit', 'btn-primary', () => { closeDlg(); G = null; drop(KEY); render(); }))); }) : null,
      btn('Close', '', closeDlg));
  });

  if (G && G.v !== 1) G = null;
  render();
})();


if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
